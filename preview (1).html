<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Extreme Demon Journey</title>
<style>
:root{
  --bg:#070b10;--bg2:#111821;--panel:rgba(17,24,33,.9);--panel2:#0d141c;
  --line:#2a3645;--text:#f6f8fb;--muted:#9aa8bb;--accent:#55e4ab;--accent2:#6aa8ff;
  --danger:#ff6b83;--warning:#ffc36b;--shadow:0 20px 80px rgba(0,0,0,.32);--radius:18px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
body{
  background:
    radial-gradient(circle at 10% -5%,rgba(85,228,171,.13),transparent 28%),
    radial-gradient(circle at 88% 0%,rgba(106,168,255,.10),transparent 30%),
    linear-gradient(140deg,var(--bg),var(--bg2));
  transition:.35s ease
}
body.theme-1{--bg:#070b10;--bg2:#121a22;--accent:#55e4ab;--accent2:#6aa8ff}
body.theme-2{--bg:#0d0712;--bg2:#1d1025;--accent:#d47aff;--accent2:#ff75b7}
body.theme-3{--bg:#061016;--bg2:#0f2530;--accent:#51e3ff;--accent2:#709dff}
body.theme-4{--bg:#120b07;--bg2:#24150c;--accent:#ffbb67;--accent2:#ff756f}
body.theme-5{--bg:#08100a;--bg2:#17210f;--accent:#b5ee64;--accent2:#54deb8}
body.dark{--bg:#070707;--bg2:#111111;--panel:rgba(18,18,18,.94);--panel2:#0d0d0d;--line:#2c2c2c;--accent:#e6e6e6;--accent2:#a5a5a5}
body.light{--bg:#edf1f6;--bg2:#fff;--panel:rgba(255,255,255,.94);--panel2:#f7f9fc;--line:#d4dce7;--text:#111822;--muted:#627084;--accent:#168d64;--accent2:#3978dc;--shadow:0 20px 65px rgba(43,68,95,.13)}
body.light{background:linear-gradient(145deg,#edf1f6,#fff)}

button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:11px;font-weight:850;cursor:pointer;transition:.16s}
button:hover{transform:translateY(-1px);filter:brightness(1.07)}
button.primary{background:var(--accent);border-color:transparent;color:#05140d}
button.danger{border-color:#63303c;color:#ff9cac}
button.warning{border-color:#66512f;color:#ffd18b}
button.small{padding:7px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}

.container{max-width:1260px;margin:0 auto;padding:30px 22px 80px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:1.8px;font-weight:950}
h1{font-size:39px;line-height:1.05;letter-spacing:-1.7px;margin:6px 0 8px}
.subtitle{color:var(--muted);font-size:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;
  background:var(--panel);box-shadow:var(--shadow);padding:28px 29px;margin-bottom:20px;
  backdrop-filter:blur(16px)
}
.hero.has-bg{background-size:cover;background-position:center}
.hero.has-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.42))}
.hero>*{position:relative;z-index:1}
.heroTop{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.heroLabel{font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:950}
.heroTitle{font-size:34px;font-weight:950;margin:7px 0 4px}
.heroRank{color:var(--muted);font-size:15px;font-weight:750}
.heroStatus{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;font-weight:850}
.heroStatus.cleared{color:var(--accent);border-color:var(--accent);background:rgba(85,228,171,.08)}
.heroPct{font-size:66px;font-weight:1000;line-height:.95;letter-spacing:-2px}
.heroPctLabel{text-align:right;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:1.2px;margin-top:8px}
.bar{height:14px;border-radius:99px;overflow:hidden;background:rgba(130,145,165,.18);margin:23px 0 16px}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}
.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.heroStat{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(5,9,14,.46)}
body.light .heroStat{background:rgba(248,250,253,.8)}
.heroStat .label{font-size:11px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;font-weight:800}
.heroStat b{display:block;font-size:23px;margin-top:5px}

.mainGrid{display:grid;grid-template-columns:1.02fr .98fr;gap:18px}
.card{border:1px solid var(--line);border-radius:19px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.cardHead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cardHead h2,.cardHead h3{margin:0;font-size:18px}
.cardBody{padding:16px}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-weight:850}
.levelList{display:flex;flex-direction:column;gap:8px;max-height:840px;overflow:auto}
.levelRow{
  position:relative;display:grid;grid-template-columns:38px 76px minmax(0,1fr) 62px;gap:11px;align-items:center;
  padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:rgba(9,14,20,.62);cursor:pointer;min-width:0
}
body.light .levelRow{background:rgba(250,251,253,.8)}
.levelRow:hover{filter:brightness(1.05)}
.levelRow.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(85,228,171,.12),0 14px 36px rgba(0,0,0,.13)}
.levelNo{font-weight:950;color:var(--muted);font-size:14px;text-align:center}
.levelNameWrap{min-width:0}
.rankBadge{
  display:inline-flex;align-items:center;min-width:0;text-align:center;padding:3px 7px;border:1px solid var(--line);
  border-radius:8px;font-size:10px;font-weight:900;background:rgba(127,142,160,.06);vertical-align:middle
}
.levelName{font-size:16px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.25}
.levelMeta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.levelBest{font-size:20px;font-weight:1000;min-width:0;text-align:right;white-space:nowrap}
.levelBest.done{color:var(--accent)}
.levelThumb{width:76px;height:48px;border-radius:9px;object-fit:cover;display:block}
.levelRow.emptySlot{grid-template-columns:38px 1fr auto}
.emptySlot .levelName{color:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

.detailHeader{margin-bottom:12px}
.detailEyebrow{color:var(--accent);font-size:11px;letter-spacing:1.4px;font-weight:950}
.detailName{font-size:31px;font-weight:1000;margin:4px 0 5px}
.detailRank{color:var(--muted);font-size:14px;font-weight:750}
.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.mini{padding:14px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.mini label{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px;font-weight:850}
.mini b{display:block;font-size:23px;margin-top:5px}
.detailActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cover{margin-top:15px;min-height:210px;border:1px dashed var(--line);border-radius:16px;overflow:hidden;background:rgba(5,9,13,.35);display:flex;align-items:center;justify-content:center}
.cover img{width:100%;max-height:360px;object-fit:cover;display:block}
.cover .placeholder{text-align:center;color:var(--muted);padding:38px 20px}
.progressEdit{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(8,12,17,.42)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;font-weight:800}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(85,228,171,.1)}

.recordsTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px;margin-bottom:10px}
.recordQuick{display:flex;gap:10px;align-items:center}
.recordQuick input{font-size:17px;font-weight:850;height:48px}
.recordQuick button{height:48px;padding-inline:18px}
.records{display:flex;flex-direction:column;gap:10px;margin:0;padding:10px;overflow-y:auto;overflow-x:hidden;height:510px;max-height:none;scrollbar-gutter:stable;overscroll-behavior:contain}
.day{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel2);flex:0 0 auto}
.dayHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:rgba(127,142,160,.06);position:sticky;top:0;z-index:2;backdrop-filter:blur(8px)}
.dayHead b{font-size:15px}.dayHead small{color:var(--muted);font-size:12px}
.entry{
  display:grid;grid-template-columns:155px minmax(0,1fr);gap:24px;align-items:center;padding:20px 18px;border-top:1px solid var(--line);min-width:0
}
.entryMain{min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;min-height:110px}
.entryTime{font-size:12px;color:var(--muted);margin-bottom:10px;text-align:right}
.entryDetails{min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;text-align:right;gap:3px}
.entryBest{font-size:18px;color:var(--text);font-weight:950;line-height:1.35;letter-spacing:-.1px}
.entryRange{font-size:17px;color:var(--text);margin-top:2px;font-weight:900}
.entryAttempt{text-align:left;min-width:0;order:-1;padding-right:4px;align-self:center}
.entryAttempt b{display:block;font-size:40px;line-height:1;font-weight:1000;letter-spacing:-1px}
.entryAttempt span{display:block;color:var(--muted);font-size:11px;margin-top:7px;letter-spacing:.5px}
.entryActions{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;width:100%}
.lockNote{margin-top:10px;color:var(--muted);font-size:12px}.clearEvent{border-left:3px solid var(--accent);background:rgba(85,228,171,.06)}
.clearEvent .entryAttempt b{color:var(--accent)}

.recordsWrap{margin-top:10px;border:1px solid var(--line);border-radius:18px;padding:6px;background:rgba(5,9,13,.24);overflow:hidden;height:525px;min-height:240px}
.recordsWrap .records{height:100%;max-height:none;min-height:0}
.bgGrid.one{grid-template-columns:1fr}
.fullRecords{margin-top:18px}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:800}
tr:last-child td{border-bottom:0}

.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.modalBackdrop.show{display:flex}
.modal{width:min(700px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:19px;background:var(--bg2);box-shadow:0 35px 120px rgba(0,0,0,.55)}
.modalHead{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}
.modalHead h3{margin:0}
.modalBody{padding:18px}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;padding:15px 18px;border-top:1px solid var(--line)}
.themeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.themeBtn{position:relative;min-height:92px;text-align:left;padding:13px;overflow:hidden}
.themeBtn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch{position:absolute;inset:0;opacity:.22}
.themeName,.themeDesc{position:relative;z-index:1}
.themeName{font-weight:950}.themeDesc{font-size:11px;color:var(--muted);margin-top:5px}
.gradient1 .swatch{background:linear-gradient(120deg,#0e161b,#1d3d31,#111c37)}
.gradient2 .swatch{background:linear-gradient(120deg,#24102f,#7422a0,#30192f)}
.gradient3 .swatch{background:linear-gradient(120deg,#08242c,#086f82,#1d3c89)}
.gradient4 .swatch{background:linear-gradient(120deg,#27150c,#a94e14,#422219)}
.gradient5 .swatch{background:linear-gradient(120deg,#11200e,#568b20,#153b31)}
.darkSwatch .swatch{background:#080808;opacity:.55}.lightSwatch .swatch{background:#fff;opacity:.85}
.help{font-size:12px;line-height:1.65;color:var(--muted)}
.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(127,142,160,.05);margin-top:10px}
.successText{color:var(--accent);font-weight:900}

.fireworks{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;display:none}
.fireworks.show{display:block}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:burst 1.45s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.5);opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.celebrate{
  position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-15px);z-index:90;
  width:min(620px,calc(100% - 30px));padding:22px 24px;border:1px solid var(--accent);border-radius:18px;
  background:rgba(8,14,18,.93);box-shadow:0 25px 80px rgba(0,0,0,.5);display:none;text-align:center
}
.celebrate.show{display:block;animation:pop .35s ease-out}
.celebrate h2{margin:0 0 8px;font-size:27px}.celebrate p{margin:0;color:#d5dde7;font-size:15px;line-height:1.7}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-25px) scale(.97)}to{opacity:1;transform:translateX(-50%) translateY(-15px) scale(1)}}

@media(max-width:1020px){.mainGrid{grid-template-columns:1fr}.heroStats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .container{padding:20px 12px 60px}.topbar{flex-direction:column;align-items:flex-start}h1{font-size:32px}
  .heroTop{flex-direction:column}.heroPct{font-size:50px}.heroPctLabel{text-align:left}
  .heroStats{grid-template-columns:1fr 1fr}.detailGrid{grid-template-columns:1fr 1fr}
  .levelRow{grid-template-columns:38px 64px minmax(0,1fr) auto;gap:9px}.levelThumb{width:64px;height:40px}.rankBadge{min-width:58px;font-size:12px}
  .levelName{font-size:15px}.levelMeta{font-size:11px}.levelBest{font-size:18px;min-width:50px}
  .row{grid-template-columns:1fr}.themeGrid{grid-template-columns:1fr}.recordQuick input{font-size:15px}
}

/* v4 refinements */
.recordsWrap{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel2);min-height:120px}
.recordsWrap.has-bg{background-size:cover;background-position:center}
.recordsWrap.has-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,14,.84),rgba(5,9,14,.93))}
.recordsWrap>*{position:relative;z-index:1}
.recordsWrap .records{margin:0;padding:10px;max-height:540px}
.recordMemo{margin-top:7px;color:var(--text);font-size:12px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(127,142,160,.05)}
.bgGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bgCard{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.bgPreview{height:135px;border-radius:10px;border:1px dashed var(--line);background:linear-gradient(135deg,rgba(85,228,171,.08),rgba(106,168,255,.06));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;overflow:hidden}
.bgPreview.has{color:transparent}
.bgCard h4{margin:0 0 8px;font-size:14px}
.bgActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.dataGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dataBox{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel2)}
.dataBox h4{margin:0 0 5px;font-size:13px}.dataBox p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:680px){.bgGrid,.dataGrid{grid-template-columns:1fr}}


/* v5 visual refinements */
.recordsWrap{height:532px;min-height:0;overflow:hidden;border-radius:16px}
.recordsWrap .records{height:530px;max-height:none;overflow-y:auto;overflow-x:hidden}
.manageRow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(127,142,160,.035)}
.manageName{min-width:0;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manageThumb{width:54px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line)}
.imageField{margin-top:13px;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel2)}
.imageFieldHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.imageFieldHead b{font-size:13px}
.imagePreview{height:120px;margin-top:9px;border:1px dashed var(--line);border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.detailName{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:680px){
  .levelRow{grid-template-columns:34px 58px minmax(0,1fr) 50px;gap:8px}.levelThumb{width:58px;height:40px}.levelName{font-size:15px}.levelMeta{font-size:10px}.levelBest{font-size:17px}
  .entry{grid-template-columns:105px minmax(0,1fr);gap:13px;padding:14px}.entryAttempt b{font-size:29px}.entryBest{font-size:15px}.entryRange{font-size:14px}.recordsWrap,.recordsWrap .records{height:500px}
}


/* Record action buttons: keep them above scroll/overlay layers and always clickable. */
.recordsWrap.has-bg::before{pointer-events:none}
.entryActions{position:relative;z-index:5;pointer-events:auto}
.entryActions button{position:relative;z-index:6;pointer-events:auto;touch-action:manipulation;cursor:pointer}


/* Final record delete hardening */
.entryActions,.entryActions *{pointer-events:auto!important}
.recordAction{cursor:pointer!important;touch-action:manipulation!important}
#modal{z-index:99999!important}
</style>
</head>
<body class="theme-1">

<div class="container">
  <header class="topbar">
    <div>
      <div class="eyebrow">Geometry Dash • Personal Tracker</div>
      <h1>Extreme Demon Journey</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="actions">
      <button onclick="openSettings()">⚙ 설정</button>
      <button class="primary" onclick="openMapModal()">＋ 맵 등록</button>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <div class="mainGrid">
    <section class="card">
      <div class="cardHead">
        <h2>🎯 목표 순서</h2>
        <div style="display:flex;gap:7px;align-items:center">
          <span class="badge" id="filledBadge">30/30</span>
          <button class="small" onclick="openManageModal()">목표 관리</button>
        </div>
      </div>
      <div class="cardBody"><div class="levelList" id="levelList"></div></div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2>🩸 도전 상세</h2>
        <span class="badge" id="dayClock"></span>
      </div>
      <div class="cardBody" id="detail"></div>
    </section>
  </div>

  <section class="card fullRecords">
    <div class="cardHead">
      <h2>📋 전체 기록</h2>
      <span class="badge">오전 8:00 기준으로 기록일 변경</span>
    </div>
    <div class="cardBody">
      <div class="help">같은 기록일에는 여러 번 기록할 수 있어. 오전 8시가 지나면 이전 기록일은 자동으로 잠기고 수정할 수 없어.</div>
      <div id="allRecords"></div>
    </div>
  </section>
</div>

<div class="modalBackdrop" id="modal">
  <div class="modal" id="modalInner"></div>
</div>

<div class="fireworks" id="fireworks"></div>
<div class="celebrate" id="celebrate">
  <h2>🎉 클리어를 축하드립니다!</h2>
  <p id="celebrateText">정말 대단합니다. 여기까지 노력하신 시간이 모두 기록됐습니다.<br>다음 도전에서도 충분히 해내실 수 있습니다.</p>
</div>

<script>
const STORAGE_KEY = "gdTrackerV5";
const LEGACY_KEYS = ["gdTrackerV4","gdTrackerV3"];
const FRESH_START_KEY = "gdTrackerFreshStart2026_09_13";
const KST = "Asia/Seoul";

const defaultMaps = [
  ["Sweater Weather",1565],["Azurite",1509],["Cataclysm",1477],["EdenCity",1403],["Redemption",1394],
  ["Deception Dive",1303],["Out of Chaos",1090],["aftermath",988],["EKO",890],["Prismatic Haze",866],
  ["Bloodbath",832],["Sakupen Hell",758],["Infernal Abyss",712],["Athanatos",684],["Hyper Paradox",640],
  ["Ethereal Artifice",563],["Quantum Processing",554],["Artificial Ascent",520],["Digital Descent",486],["Devotion",391],
  ["Sonic Wave",377],["Wasureta",360],["Arctic Lights",309],["Bloodlust",253],["Cosmic Cyclone",199],
  ["The Golden",119],["Firework",51],["Slaughterhouse",33],["Acheron",23],["Amethyst",3]
];

function uid(){return (crypto?.randomUUID?.() || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`)}
function blankMap(slot){
  return {id:uid(),slot,name:"",rank:"",best:0,totalAttempts:0,cleared:false,clearDate:"",clearPreviousBest:null,mapBg:"",detailBg:"",records:[],notes:""};
}
function freshMaps(){
  return defaultMaps.map((m,i)=>({
    id:uid(),slot:i+1,name:m[0],rank:m[1],best:0,totalAttempts:0,cleared:false,
    clearDate:"",clearPreviousBest:null,mapBg:"",detailBg:"",records:[],notes:""
  }));
}
function normalizeMap(m,i){
  const raw=m||{};
  const migratedMapBg = raw.mapBg || raw.listBg || raw.bg || "";
  const migratedDetail = raw.detailBg || "";
  const x = {...blankMap(i+1),...raw,slot:i+1,mapBg:migratedMapBg,detailBg:migratedDetail};
  delete x.listBg;
  delete x.recordBg;
  x.records = Array.isArray(x.records) ? x.records.map(r=>({...r, id:r.id||uid()})) : [];
  x.totalAttempts = x.records.filter(r=>r.type!=="clear").reduce((s,r)=>s+(Number(r.attempts)||0),0);
  const recordBest = x.records.filter(r=>r.type!=="clear").reduce((mx,r)=>Math.max(mx,Math.min(100,Number(r.best)||0)),0);
  x.best = Math.min(100, Math.max(Number(x.best)||0, recordBest));
  if(x.cleared){x.best=100;x.clearDate ||= (x.records.find(r=>r.type==="clear")?.dayKey||"");}
  return x;
}
function normalizeState(raw){
  const base = freshMaps();
  if(!raw || typeof raw!=="object") return {version:4,maps:base,selected:0,theme:"theme-1",subtitle:"내 익스트림 데몬 도전 기록"};
  const old = Array.isArray(raw.maps)?raw.maps:[];
  const maps = base.map((m,i)=>normalizeMap(old[i]?{...m,...old[i]}:m,i));
  return {
    version:4,
    maps,
    selected:Math.min(29,Math.max(0,Number(raw.selected)||0)),
    theme:["theme-1","theme-2","theme-3","theme-4","theme-5","dark","light"].includes(raw.theme)?raw.theme:"theme-1",
    subtitle:String(raw.subtitle||"내 익스트림 데몬 도전 기록")
  };
}

function loadState(){
  try{
    // 새 사이트 시작 시 이전 테스트/기록을 한 번만 완전히 비웁니다.
    if(localStorage.getItem(FRESH_START_KEY) !== "1"){
      [STORAGE_KEY,...LEGACY_KEYS,"gdTrackerV5"].forEach(key=>localStorage.removeItem(key));
      localStorage.setItem(FRESH_START_KEY,"1");
      return normalizeState(null);
    }
    const current = localStorage.getItem(STORAGE_KEY);
    if(current) return normalizeState(JSON.parse(current));
  }catch(e){console.warn("state load failed",e)}
  return normalizeState(null);
}
let state = loadState();
let mapIndex = state.selected;

function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}
  catch(e){console.error(e);alert("저장 공간이 부족합니다. 배경 이미지를 더 압축하거나 백업 후 오래된 이미지를 정리해 주세요.");return false}
}
function selected(){return state.maps[mapIndex]}
function fmt(n){return Number(n||0).toLocaleString("ko-KR")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function koreaParts(ts=Date.now()){
  const parts=new Intl.DateTimeFormat("ko-KR",{timeZone:KST,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(ts));
  return Object.fromEntries(parts.filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
}
function koreaDateKey(ts=Date.now()){
  const p=koreaParts(ts);
  let y=+p.year,m=+p.month,d=+p.day;
  if(+p.hour<8){const tmp=new Date(Date.UTC(y,m-1,d)-86400000);y=tmp.getUTCFullYear();m=tmp.getUTCMonth()+1;d=tmp.getUTCDate()}
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function dayKey(ts=Date.now()){return koreaDateKey(ts)}
function localTime(ts){const p=koreaParts(ts);return `${p.hour}:${p.minute}`}
function isLocked(key){return key < dayKey()}
function dayIndex(m,key){
  const keys=[...new Set((m.records||[]).filter(r=>r.dayKey).map(r=>r.dayKey))].sort();
  const pos=keys.indexOf(key);
  return pos>=0?pos+1:keys.filter(k=>k<key).length+1;
}

function render(){
  document.body.className=state.theme;
  document.getElementById("subtitle").textContent=state.subtitle;
  document.getElementById("dayClock").textContent=`현재 기록일 ${dayKey()}`;
  renderHero();renderList();renderDetail();renderAllRecords();save();
}
function renderHero(){
  const m=selected(),hero=document.getElementById("hero");
  if(!m?.name){
    hero.className="hero";hero.style.backgroundImage="";
    hero.innerHTML="<div class='empty'>이 슬롯은 비어 있습니다. 목표 관리에서 새 맵을 등록해 주세요.</div>";return;
  }
  hero.className="hero"+(m.mapBg?" has-bg":"");hero.style.backgroundImage=m.mapBg?`url("${m.mapBg}")`:"";
  const pct=Math.min(100,Math.max(0,m.best||0));
  hero.innerHTML=`
    <div class="heroTop">
      <div><div class="heroLabel">${m.cleared?"CLEARED LEVEL":"CURRENT TARGET"}</div>
        <div class="heroTitle">${esc(m.name)}</div>
        <div class="heroRank">목표 ${m.slot}단계 · 현재 순위 <b>#${m.rank||"—"}</b></div>
        <span class="heroStatus ${m.cleared?"cleared":""}">${m.cleared?"✓ CLEAR":"⚡ 도전 중"}</span>
      </div>
      <div><div class="heroPct">${pct}%</div><div class="heroPctLabel">BEST</div></div>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="heroStats">
      <div class="heroStat"><div class="label">TOTAL ATTEMPTS</div><b>${fmt(m.totalAttempts)}</b></div>
      <div class="heroStat"><div class="label">RECORD DAYS</div><b>${new Set((m.records||[]).filter(r=>r.type!=="clear").map(r=>r.dayKey)).size}</b></div>
      <div class="heroStat"><div class="label">STATUS</div><b>${m.cleared?"CLEAR":"PLAYING"}</b></div>
      <div class="heroStat"><div class="label">CLEAR DATE</div><b>${m.cleared?(m.clearDate||"—"):"—"}</b></div>
    </div>`;
}
function renderList(){
  const el=document.getElementById("levelList"),filled=state.maps.filter(x=>x.name).length;
  document.getElementById("filledBadge").textContent=`${filled}/30`;
  el.innerHTML=state.maps.map((m,i)=>{
    if(!m.name)return `<div class="levelRow emptySlot" onclick="selectMap(${i})"><div class="levelNo">${String(i+1).padStart(2,"0")}</div><div><div class="levelName">비어 있는 목표 슬롯</div><div class="levelMeta">이 자리에 새 맵 등록</div></div><div>＋</div></div>`;
    const thumb=m.mapBg?`<img class="levelThumb" src="${m.mapBg}" alt="">`:`<div class="levelThumb" style="background:linear-gradient(135deg,rgba(85,228,171,.12),rgba(106,168,255,.10));"></div>`;
    const status=m.cleared?`<span class="successText">✓ CLEARED · ${esc(m.clearDate||"—")}</span>`:`도전 중`;
    return `<div class="levelRow ${i===mapIndex?"active":""}" onclick="selectMap(${i})">
      <div class="levelNo">${String(i+1).padStart(2,"0")}</div>${thumb}
      <div class="levelNameWrap"><div class="levelName">${m.cleared?"✓ ":""}${esc(m.name)}</div><div class="levelMeta"><span class="rankBadge">#${m.rank||"—"}</span><span>${status}</span></div></div>
      <div class="levelBest ${m.cleared?"done":""}">${m.best}%</div>
    </div>`;
  }).join("");
}
function selectMap(i){mapIndex=i;state.selected=i;render();window.scrollTo({top:0,behavior:"smooth"})}

function renderDetail(){
  const m=selected(),el=document.getElementById("detail");
  if(!m?.name){el.innerHTML=`<div class="empty"><div style="font-size:36px;margin-bottom:8px">＋</div><div style="font-size:18px;font-weight:900;color:var(--text)">이 목표 슬롯은 비어 있습니다</div><div style="margin-top:7px">새 익스트림 데몬을 등록하면 바로 기록할 수 있습니다.</div><button class="primary" style="margin-top:16px" onclick="openMapModal(${mapIndex})">이 슬롯에 맵 등록</button></div>`;return}
  const recs=[...(m.records||[])].sort((a,b)=>b.timestamp-a.timestamp);
  el.innerHTML=`
    <div class="detailHeader"><div class="detailEyebrow">${m.cleared?"CLEARED LEVEL":"SELECTED TARGET"}</div><div class="detailName">${esc(m.name)}</div><div class="detailRank">현재 순위 <b>#${m.rank||"—"}</b> · ${m.slot}단계</div></div>
    <div class="detailGrid"><div class="mini"><label>BEST</label><b>${m.best}%</b></div><div class="mini"><label>TOTAL ATTEMPTS</label><b>${fmt(m.totalAttempts)}</b></div><div class="mini"><label>RECORD DAYS</label><b>${new Set(recs.filter(r=>r.type!=="clear").map(r=>r.dayKey)).size}</b></div></div>
    <div class="detailActions">
      <button class="primary" onclick="openRecordForm()">＋ 기록 적기</button>
      <button onclick="openMapEdit(${mapIndex})">✏ 맵 수정</button>
      <button onclick="openBackgroundModal()">🖼 배경 수정</button>
      ${m.cleared?`<button type="button" id="clearToggleBtn" class="warning" onclick="openUndoClearConfirm()">↩ 도전 중으로 되돌리기</button>`:`<button type="button" id="clearToggleBtn" class="primary clearButton" onclick="openClearConfirm()">✓ 클리어</button>`}
    </div>
    <div class="cover">${m.detailBg?`<img src="${m.detailBg}" alt="${esc(m.name)} 배경">`:`<div class="placeholder">아직 이 맵의 배경 이미지가 없습니다.<br>‘배경 수정’에서 상세 배경을 추가해 주세요.</div>`}</div>
    <div class="recordsTitle"><b style="font-size:17px">📝 기록 목록</b><span class="badge">오전 8:00 기준 · 이전 기록 잠금</span></div>
    <div class="recordQuick"><input id="quickAttempts" type="number" min="1" placeholder="오늘 시도한 어템 수" onkeydown="quickKey(event)"><button class="primary" onclick="addQuickRecord()">기록</button></div>
    <div class="help" style="margin-top:7px">기본 입력은 Attempts만. Best / Progress / 메모는 ‘＋ 기록 적기’에서 자세히 남길 수 있습니다.</div>
    <div class="recordsWrap"><div class="records">${renderRecordDays(recs)}</div></div>`;
}
function renderRecordDays(recs){
  if(!recs.length)return `<div class="empty">아직 기록이 없습니다.</div>`;
  const groups={};recs.forEach(r=>(groups[r.dayKey]??=[]).push(r));
  return Object.keys(groups).sort().reverse().map(key=>{
    const g=groups[key].sort((a,b)=>b.timestamp-a.timestamp),locked=isLocked(key);
    return `<div class="day"><div class="dayHead"><b>${key} · ${dayIndex(selected(),key)}일차</b>${locked?`<span class="badge">🔒 Locked</span>`:`<span class="badge">✎ 기록 가능</span>`}</div>${g.map(r=>r.type==="clear"?renderClearEntry(r):renderNormalEntry(r,locked)).join("")}</div>`;
  }).join("");
}
function renderNormalEntry(r,locked){
  return `<div class="entry"><div class="entryAttempt"><b>${fmt(r.attempts)}</b><span>attempts</span></div><div class="entryMain"><div class="entryTime">${localTime(r.timestamp)}</div><div class="entryDetails"><div class="entryBest">${r.best!==""?`Best ${esc(r.best)}%`:`Best 기록 없음`}</div><div class="entryRange">${r.range?`Progress ${esc(r.range)}`:`Progress 기록 없음`}</div>${r.memo?`<div class="recordMemo">${esc(r.memo)}</div>`:""}</div>${!locked?`<div class="entryActions"><button type="button" class="small recordAction" data-record-action="edit" data-record-id="${r.id}" onclick="handleRecordAction(event,'edit','${r.id}')">수정</button><button type="button" class="small danger recordAction" data-record-action="delete" data-record-id="${r.id}" onclick="handleRecordAction(event,'delete','${r.id}')">삭제</button></div>`:`<div class="lockNote">🔒 이전 기록은 잠겨 있습니다.</div>`}</div></div>`;
}
function renderClearEntry(r){
  return `<div class="entry clearEvent"><div class="entryAttempt"><b>100%</b><span>CLEAR</span></div><div class="entryMain"><div class="entryTime">${localTime(r.timestamp)}</div><div class="entryDetails"><div class="entryBest">클리어 완료</div><div class="entryRange">${esc(r.dayKey||"")}</div></div><div class="lockNote">🎉 ${esc(selected().name)} 클리어 기록</div></div></div>`;
}

function openRecordForm(){openModal("record")}
function addRecord(attempts,best="",range="",memo=""){
  const m=selected(),key=dayKey();if(!m)return;if(isLocked(key))return alert("현재 기록일만 입력할 수 있습니다.");
  const a=Math.max(1,Number(attempts)||0);m.totalAttempts += a;
  if(best!=="")m.best=Math.max(m.best,Math.min(100,Math.max(0,Number(best)||0)));
  m.records.push({id:uid(),type:"attempt",dayKey:key,timestamp:Date.now(),attempts:a,best:String(best),range:String(range||""),memo:String(memo||"")});
  if(m.best>=100 && !m.cleared){save();render();requestClear();return}
  save();render();
}
function editRecord(id){const m=selected(),r=m?.records.find(x=>x.id===id);if(!r||r.type==="clear"||isLocked(r.dayKey))return;openModal("editRecord",r)}
function deleteRecord(id){
  const m=selected(),idx=m?.records.findIndex(x=>x.id===id);
  if(!m||idx<0)return;
  const r=m.records[idx];
  if(r.type==="clear"||isLocked(r.dayKey))return;
  openDeleteRecordConfirm(id);
}
function openDeleteRecordConfirm(id){
  const m=selected(),r=m?.records.find(x=>x.id===id);
  if(!m||!r||r.type==="clear"||isLocked(r.dayKey))return;
  const inner=document.getElementById("modalInner");
  inner.innerHTML=`<div class="modalHead"><h3>기록 삭제</h3><button type="button" onclick="closeModal()">✕</button></div><div class="modalBody"><div class="notice"><b>${fmt(r.attempts)} attempts</b> 기록을 삭제할까요?<br>삭제하면 이 기록의 Attempts와 Best 계산이 다시 정리됩니다.</div></div><div class="modalFoot"><button type="button" onclick="closeModal()">취소</button><button type="button" class="danger" onclick="confirmDeleteRecord('${r.id}')">삭제</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function confirmDeleteRecord(id){
  const m=selected(),idx=m?.records.findIndex(x=>x.id===id);
  if(!m||idx<0){closeModal();return;}
  const r=m.records[idx];
  if(r.type==="clear"||isLocked(r.dayKey)){closeModal();return;}
  m.totalAttempts=Math.max(0,m.totalAttempts-(+r.attempts||0));
  m.records.splice(idx,1);
  const recordBest=m.records.filter(x=>x.type!=="clear").reduce((mx,x)=>Math.max(mx,Number(x.best)||0),0);
  m.best=m.cleared?100:Math.min(100,recordBest);
  save();closeModal();render();
}
function handleRecordAction(e,action,id){
  if(e){e.preventDefault();e.stopPropagation();}
  if(action==="delete") deleteRecord(id);
  else if(action==="edit") editRecord(id);
  return false;
}
function submitRecord(){
  const a=+document.getElementById("recAttempts").value||0;if(!a)return alert("세션 어템을 입력해 주세요.");
  addRecord(a,document.getElementById("recBest").value,document.getElementById("recRange").value.trim(),document.getElementById("recMemo").value.trim());closeModal();
}
function submitEditRecord(id){
  const m=selected(),r=m?.records.find(x=>x.id===id);if(!m||!r||isLocked(r.dayKey))return;
  const oldA=+r.attempts||0,newA=+document.getElementById("erAttempts").value||0;if(newA<1)return alert("세션 어템은 1 이상이어야 합니다.");
  r.attempts=newA;r.best=document.getElementById("erBest").value;r.range=document.getElementById("erRange").value.trim();r.memo=document.getElementById("erMemo").value.trim();
  m.totalAttempts=Math.max(0,m.totalAttempts-oldA+newA);
  const recordBest=m.records.filter(x=>x.type!=="clear").reduce((mx,x)=>Math.max(mx,Number(x.best)||0),0);m.best=m.cleared?100:recordBest;
  save();render();closeModal();
}

function renderAllRecords(){
  const el=document.getElementById("allRecords");
  const rows=[];
  state.maps.forEach((m,mi)=>(m.records||[]).forEach(r=>rows.push({map:m,index:mi,...r})));
  rows.sort((a,b)=>b.timestamp-a.timestamp);
  if(!rows.length){el.innerHTML="<div class='empty'>전체 기록이 아직 없습니다.</div>";return}
  el.innerHTML=`<div class="tableWrap"><table><thead><tr><th>맵</th><th>기록일</th><th>시간</th><th>Attempts</th><th>Best</th><th>Progress / 상태</th></tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr><td><b>${esc(r.map.name||"비어 있음")}</b></td><td>${esc(r.dayKey||"—")}</td><td>${localTime(r.timestamp)}</td><td><b>${r.type==="clear"?"—":fmt(r.attempts)}</b></td><td>${r.type==="clear"?"100%":(r.best!==""?esc(r.best)+"%":"—")}</td><td>${r.type==="clear"?"🎉 CLEAR":(r.range?esc(r.range):"—")}</td></tr>`).join("")}</tbody></table></div>`;
}

function openMapModal(slot=mapIndex){mapIndex=slot;state.selected=slot;openModal("map")}
function openMapEdit(i){openManageEditModal(i)}
function pickManageListBg(i){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=e=>compressImage(e.target.result,1000,600,.78,data=>{state.maps[i].mapBg=data;save();openManageEditModal(i)});rd.readAsDataURL(f)};
  inp.click();
}
function clearManageListBg(i){state.maps[i].mapBg="";save();openManageEditModal(i)}
function openManageEditModal(i){
  const m=state.maps[i],inner=document.getElementById("modalInner"),bd=document.getElementById("modal");bd.classList.add("show");
  inner.innerHTML=`<div class="modalHead"><h3>✏ 목표 수정 · ${esc(m.name||`슬롯 ${String(i+1).padStart(2,"0")}`)}</h3><button onclick="closeModal()">✕</button></div>
  <div class="modalBody"><div class="row"><div class="field"><label>맵 이름</label><input id="mapName" value="${esc(m.name||"")}" placeholder="예: Bloodbath"></div><div class="field"><label>현재 순위</label><input id="mapRank" type="number" min="1" value="${m.rank||""}" placeholder="예: 832"></div></div>
  <div class="imageField"><div class="imageFieldHead"><b>맵 배경</b><span class="badge">목표 순서 + 상단 큰 배경</span></div><div class="imagePreview" id="manageListPreview" style="${m.mapBg?`background-image:url('${m.mapBg}')`:""}">${m.mapBg?"":"이미지를 선택하면 목표 순서와 상단 큰 배경에 함께 표시됩니다."}</div><div class="bgActions"><button class="small primary" onclick="pickManageListBg(${i})">🖼 이미지 선택</button><button class="small danger" onclick="clearManageListBg(${i})">제거</button></div></div>
  <div class="notice help">이 맵 배경은 <b>목표 순서 카드와 화면 최상단 큰 배경</b>에 함께 적용됩니다. 상세 화면 아래의 큰 이미지 영역은 ‘배경 수정’에서 별도로 관리합니다.</div></div>
  <div class="modalFoot"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveMap('editMap',${i})">저장</button></div>`;
}
function saveMap(type,i){
  const m=state.maps[i],name=document.getElementById("mapName").value.trim();if(!name)return alert("맵 이름을 입력해 주세요.");
  m.name=name;m.rank=(+document.getElementById("mapRank").value||"");mapIndex=i;state.selected=i;save();render();closeModal();
}

function openManageModal(){
  const inner=document.getElementById("modalInner"),bd=document.getElementById("modal");bd.classList.add("show");
  inner.innerHTML=`<div class="modalHead"><h3>🎯 목표 관리</h3><button onclick="closeModal()">✕</button></div><div class="modalBody"><div class="help">1~30번 슬롯은 유지됩니다. 각 맵의 이름·순위와 <b>맵 배경(목표 순서 + 상단 큰 배경)</b>을 이곳에서 관리합니다. 아래 상세 이미지 영역은 ‘배경 수정’에서 따로 설정합니다.</div><div style="margin-top:13px;display:flex;flex-direction:column;gap:7px">${state.maps.map((m,i)=>{const thumb=m.mapBg?`<img class="manageThumb" src="${m.mapBg}" alt="">`:`<div class="manageThumb" style="background:rgba(127,142,160,.08)"></div>`;return `<div class="manageRow"><b style="color:var(--muted)">${String(i+1).padStart(2,"0")}</b><div style="display:flex;align-items:center;gap:10px;min-width:0">${thumb}<span class="manageName">${m.name?esc(m.name):"비어 있음"}</span></div><button class="small" onclick="closeModal();selectMap(${i});setTimeout(()=>${m.name?`openManageEditModal(${i})`:`openMapModal(${i})`},50)">${m.name?"수정":"등록"}</button>${m.name?`<button class="small danger" onclick="protectedDelete(${i})">삭제</button>`:`<span></span>`}</div>`}).join("")}</div></div><div class="modalFoot"><button onclick="closeModal()">닫기</button></div>`;
}
function protectedDelete(i){
  const m=state.maps[i];if(!m?.name)return;const typed=prompt(`삭제하려면 아래 맵 이름을 그대로 입력해 주세요.\n\n${m.name}`);if(typed===null)return;if(typed.trim()!==m.name)return alert("맵 이름이 정확하지 않아 삭제하지 않았습니다.");
  if(!confirm(`정말 '${m.name}'을(를) 삭제할까요?\n\n맵 배경, 상세 배경, Best, Attempts, 날짜별 기록, 클리어 정보가 모두 삭제됩니다.`))return;
  state.maps[i]=blankMap(i+1);state.selected=i;mapIndex=i;save();openManageModal();render();
}

function openBackgroundModal(){
  const m=selected();if(!m||!m.name)return;
  const inner=document.getElementById("modalInner"),bd=document.getElementById("modal");bd.classList.add("show");
  const preview=(src,label)=>src?`<div class="bgPreview has" style="background-image:url('${src}')"></div><div class="help" style="margin-top:6px">${label}</div>`:`<div class="bgPreview">${label}<br>아직 이미지가 없습니다.</div>`;
  inner.innerHTML=`<div class="modalHead"><h3>🖼 배경 수정 · ${esc(m.name)}</h3><button onclick="closeModal()">✕</button></div>
  <div class="modalBody">
    <div class="bgGrid one">
      <div class="bgCard">
        <h4>DETAIL BACKGROUND</h4>
        ${preview(m.detailBg,"도전 상세 아래에 표시되는 이 이미지 영역만 변경합니다.")}
        <div class="bgActions"><button class="small primary" onclick="pickBackground('detailBg')">이미지 선택</button><button class="small danger" onclick="clearBackground('detailBg')">제거</button></div>
      </div>
    </div>
    <div class="notice help"><b>맵 배경과는 별개입니다.</b> 목표 관리 → 수정에서 맵 배경을 바꾸면 목표 순서 썸네일과 화면 최상단 큰 배경이 함께 바뀝니다.</div>
  </div>
  <div class="modalFoot"><button onclick="closeModal()">닫기</button></div>`;
}
function pickBackground(kind){
  if(kind!=="detailBg") return;
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=e=>compressImage(e.target.result,1200,700,.78,data=>{selected()[kind]=data;save();openBackgroundModal();});rd.readAsDataURL(f)};inp.click();
}
function clearBackground(kind){if(kind!=="detailBg")return;selected().detailBg="";save();render();openBackgroundModal()}
function compressImage(src,w,h,q,cb){
  const img=new Image();img.onload=()=>{const r=Math.min(w/img.width,h/img.height,1),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q))};img.src=src;
}

function exportBackup(){
  const payload={app:"Extreme Demon Journey",version:4,exportedAt:new Date().toISOString(),state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`extreme-demon-journey-backup-${dayKey()}.json`;a.click();URL.revokeObjectURL(url);
}
function importBackup(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);const candidate=parsed.state||parsed;if(!Array.isArray(candidate.maps))throw new Error("maps missing");if(!confirm("현재 데이터를 백업 파일로 덮어쓸까요? 먼저 현재 상태를 Export로 백업해 두는 것을 권장합니다."))return;state=normalizeState(candidate);mapIndex=state.selected;save();render();closeModal();alert("백업 데이터를 복원했습니다.")}catch(e){alert("백업 파일을 읽지 못했습니다. Extreme Demon Journey에서 만든 JSON인지 확인해 주세요.")}};rd.readAsText(f)};inp.click();
}
function resetAllData(){
  if(!confirm("사이트의 모든 기록과 설정을 초기화할까요? 되돌릴 수 없습니다. 먼저 Export 백업을 권장합니다."))return;
  const again=prompt("초기화하려면 RESET 을 입력해 주세요.");if(again!=="RESET")return;
  state=normalizeState(null);mapIndex=0;save();render();closeModal();
}

function openModal(type,data){
  const bd=document.getElementById("modal"),inner=document.getElementById("modalInner");bd.classList.add("show");let content="";
  if(type==="map"||type==="editMap"){
    const m=type==="editMap"?state.maps[data]:state.maps[mapIndex];content=`<div class="modalHead"><h3>${type==="map"?"새 맵 등록":"맵 수정"}</h3><button onclick="closeModal()">✕</button></div><div class="modalBody"><div class="row"><div class="field"><label>맵 이름</label><input id="mapName" value="${esc(m?.name||"")}" placeholder="예: Bloodbath"></div><div class="field"><label>현재 순위</label><input id="mapRank" type="number" min="1" value="${m?.rank||""}" placeholder="예: 832"></div></div><div class="notice help">이 메뉴에서는 이름과 현재 순위만 수정합니다. 기록과 클리어 상태는 상세 화면에서 별도로 관리합니다.</div></div><div class="modalFoot"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveMap('${type}',${type==="editMap"?data:mapIndex})">${type==="map"?"등록":"저장"}</button></div>`;
  }else if(type==="record"){
    const m=selected(),now=Date.now();content=`<div class="modalHead"><h3>기록 적기 · ${esc(m.name)}</h3><button onclick="closeModal()">✕</button></div><div class="modalBody"><div class="notice"><b>${dayKey()}</b> · ${dayIndex(m,dayKey())}일차 · ${localTime(now)}</div><div class="field" style="margin-top:13px"><label>이번 세션 어템 <span style="color:var(--danger)">*</span></label><input id="recAttempts" type="number" min="1" placeholder="예: 300" autofocus></div><div class="row" style="margin-top:10px"><div class="field"><label>이번 기록의 Best (%) · 선택</label><input id="recBest" type="number" min="0" max="100" placeholder="예: 47"></div><div class="field"><label>Progress / 구간 · 선택</label><input id="recRange" placeholder="예: 44~100"></div></div><div class="field" style="margin-top:10px"><label>메모 · 선택</label><input id="recMemo" placeholder="예: 마지막 웨이브 안정화"></div></div><div class="modalFoot"><button onclick="closeModal()">취소</button><button class="primary" onclick="submitRecord()">기록 저장</button></div>`;
  }else if(type==="editRecord"){
    const r=data;content=`<div class="modalHead"><h3>기록 수정</h3><button onclick="closeModal()">✕</button></div><div class="modalBody"><div class="notice"><b>${r.dayKey}</b> · ${localTime(r.timestamp)} · 오전 8시 기준 기록일</div><div class="row" style="margin-top:12px"><div class="field"><label>세션 어템</label><input id="erAttempts" type="number" min="1" value="${r.attempts}"></div><div class="field"><label>Best (%)</label><input id="erBest" type="number" min="0" max="100" value="${r.best||""}"></div></div><div class="row" style="margin-top:10px"><div class="field"><label>Progress / 구간</label><input id="erRange" value="${esc(r.range||"")}" placeholder="예: 44~100"></div><div class="field"><label>메모</label><input id="erMemo" value="${esc(r.memo||"")}"></div></div></div><div class="modalFoot"><button onclick="closeModal()">취소</button><button class="primary" onclick="submitEditRecord('${r.id}')">저장</button></div>`;
  }else if(type==="settings"){
    content=`<div class="modalHead"><h3>⚙ 사이트 설정</h3><button onclick="closeModal()">✕</button></div><div class="modalBody"><div class="field"><label>사이트 부제목</label><input id="subtitleInput" value="${esc(state.subtitle)}"></div><div style="margin-top:16px"><label>전체 화면 디자인</label><div class="themeGrid">${themeBtn("theme-1","gradient1","Emerald Night","초록 × 네이비")}${themeBtn("theme-2","gradient2","Violet Pulse","보라 × 핑크")}${themeBtn("theme-3","gradient3","Cyber Ocean","청록 × 블루")}${themeBtn("theme-4","gradient4","Inferno Gold","주황 × 레드")}${themeBtn("theme-5","gradient5","Toxic Green","라임 × 딥그린")}${themeBtn("dark","darkSwatch","Pure Dark","깔끔한 다크 모드")}${themeBtn("light","lightSwatch","Clean White","깔끔한 화이트 모드")}</div></div><div class="dataGrid"><div class="dataBox"><h4>데이터 백업</h4><p>현재 맵, 기록, 배경, 테마를 JSON으로 저장합니다.</p><div style="margin-top:9px"><button class="small primary" onclick="exportBackup()">Export 백업</button></div></div><div class="dataBox"><h4>데이터 복원</h4><p>Export로 만든 JSON을 이 브라우저에 복원합니다.</p><div style="margin-top:9px"><button class="small" onclick="importBackup()">Import 복원</button></div></div><div class="dataBox"><h4>전체 초기화</h4><p>모든 기록을 지우고 기본 30개 목표로 되돌립니다.</p><div style="margin-top:9px"><button class="small danger" onclick="resetAllData()">전체 데이터 삭제</button></div></div></div><div class="notice help">기록과 이미지는 이 브라우저의 localStorage에 저장됩니다. 다른 기기에서는 자동 동기화되지 않으므로 정기적인 Export 백업을 권장합니다.</div></div><div class="modalFoot"><button onclick="closeModal()">닫기</button><button class="primary" onclick="saveSettings()">설정 저장</button></div>`;
  }
  inner.innerHTML=content;
}
function themeBtn(theme,cls,name,desc){return `<button type="button" class="themeBtn ${cls} ${state.theme===theme?"active":""}" onclick="previewTheme('${theme}')"><span class="swatch"></span><span class="themeName">${name}</span><div class="themeDesc">${desc}</div></button>`}
function previewTheme(th){state.theme=th;document.body.className=th;const grid=document.getElementById("modalInner")?.querySelector(".themeGrid");if(grid)grid.innerHTML=[["theme-1","gradient1","Emerald Night","초록 × 네이비"],["theme-2","gradient2","Violet Pulse","보라 × 핑크"],["theme-3","gradient3","Cyber Ocean","청록 × 블루"],["theme-4","gradient4","Inferno Gold","주황 × 레드"],["theme-5","gradient5","Toxic Green","라임 × 딥그린"],["dark","darkSwatch","Pure Dark","깔끔한 다크 모드"],["light","lightSwatch","Clean White","깔끔한 화이트 모드"]].map(x=>themeBtn(...x)).join("")}
function saveSettings(){state.subtitle=document.getElementById("subtitleInput").value.trim()||"내 익스트림 데몬 도전 기록";save();render();closeModal()}
function openSettings(){openModal("settings")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

// Stable record action handler: works after render() replaces the record list.
document.addEventListener("click",e=>{
  const btn=e.target.closest("button[data-record-action][data-record-id]");
  if(!btn)return;
  // Fallback for dynamically generated buttons; inline handler handles normal clicks first.
  handleRecordAction(e,btn.dataset.recordAction,btn.dataset.recordId);
},true);

function quickKey(e){
  if(e.key==="Enter") addQuickRecord();
}
function addQuickRecord(){
  const inp=document.getElementById("quickAttempts");
  if(!inp)return;
  const raw=inp.value.trim();
  const attempts=Number(raw);
  if(!Number.isFinite(attempts)||attempts<1){alert("오늘 시도한 어템 수를 1 이상 입력해 주세요.");inp.focus();return;}
  addRecord(Math.floor(attempts));
  const fresh=document.getElementById("quickAttempts");
  if(fresh){fresh.value="";fresh.focus();}
}
function openClearConfirm(){
  const m=selected();
  if(!m||!m.name||m.cleared)return;
  const detail=(m.best||0)<100?`현재 Best는 <b>${m.best}%</b>입니다.<br>클리어 처리하면 Best가 <b>100%</b>로 저장됩니다.`:`현재 Best가 이미 <b>100%</b>입니다.`;
  document.getElementById("modalInner").innerHTML=`
    <div class="modalHead"><h3>🎉 클리어 확인</h3><button type="button" onclick="closeModal()">✕</button></div>
    <div class="modalBody">
      <div class="notice"><b>${esc(m.name)}</b>을(를) 클리어한 것으로 기록합니다.</div>
      <p class="help" style="margin:14px 0 0;line-height:1.8">${detail}<br>클리어 날짜와 CLEAR 기록도 함께 저장됩니다.</p>
    </div>
    <div class="modalFoot"><button type="button" onclick="closeModal()">취소</button><button type="button" class="primary" onclick="performClear()">✓ 클리어 확정</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function performClear(){
  const m=selected();
  if(!m||!m.name||m.cleared){closeModal();return;}
  m.clearPreviousBest=Number(m.best)||0;
  m.best=100;
  m.cleared=true;
  m.clearDate=dayKey();
  m.records=(m.records||[]).filter(r=>r.type!=="clear");
  m.records.push({id:uid(),type:"clear",dayKey:m.clearDate,timestamp:Date.now(),attempts:0,best:"100",range:"CLEAR",memo:""});
  save();
  closeModal();
  render();
  showCelebration(m.name);
}
function openUndoClearConfirm(){
  const m=selected();
  if(!m||!m.cleared)return;
  document.getElementById("modalInner").innerHTML=`
    <div class="modalHead"><h3>↩ 도전 상태로 되돌리기</h3><button type="button" onclick="closeModal()">✕</button></div>
    <div class="modalBody"><div class="notice"><b>${esc(m.name)}</b>의 클리어 상태를 취소합니다.<br><span class="help">기존 Attempts 기록은 그대로 보존됩니다.</span></div></div>
    <div class="modalFoot"><button type="button" onclick="closeModal()">취소</button><button type="button" class="warning" onclick="performUndoClear()">↩ 되돌리기</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function performUndoClear(){
  const m=selected();
  if(!m||!m.cleared){closeModal();return;}
  const restored = Number.isFinite(Number(m.clearPreviousBest)) ? Number(m.clearPreviousBest) : Math.max(0,(m.records||[]).filter(r=>r.type!=="clear").reduce((mx,r)=>Math.max(mx,Number(r.best)||0),0));
  m.cleared=false;
  m.clearDate="";
  m.best=Math.min(100,Math.max(0,restored));
  m.clearPreviousBest=null;
  m.records=(m.records||[]).filter(r=>r.type!=="clear");
  save();closeModal();render();
}
window.openClearConfirm=openClearConfirm;
window.performClear=performClear;
window.openUndoClearConfirm=openUndoClearConfirm;
window.performUndoClear=performUndoClear;
window.requestClear=performClear;
window.undoClear=performUndoClear;

function showCelebration(name){
  const fw=document.getElementById("fireworks");fw.innerHTML="";
  for(let i=0;i<85;i++){const s=document.createElement("span");s.className="spark";s.style.left=(48+Math.random()*4)+"%";s.style.top=(18+Math.random()*5)+"%";s.style.setProperty("--dx",((Math.random()-.5)*620)+"px");s.style.setProperty("--dy",((Math.random()-.55)*440)+"px");s.style.animationDelay=(Math.random()*.18)+"s";fw.appendChild(s)}
  const remaining=state.maps.filter(x=>x && x.name && !x.cleared).length;
  const box=document.getElementById("celebrate");
  const text=document.getElementById("celebrateText");
  fw.classList.add("show");
  text.innerHTML=`<b>${esc(name)}</b> 클리어를 정말 축하드립니다!<br>여기까지 쌓아오신 노력은 절대 사라지지 않습니다.<br><strong>정말 대단합니다. 다음 도전도 자신 있게 이어가세요!</strong><br><span style="display:inline-block;margin-top:9px;color:var(--accent);font-weight:950;font-size:16px">앞으로 ${remaining}개의 Extreme Demon이 남았습니다.</span>`;
  box.classList.add("show");
  setTimeout(()=>{fw.classList.remove("show");box.classList.remove("show")},5200)
}

render();
setInterval(()=>{const d=document.getElementById("dayClock");if(d)d.textContent=`현재 기록일 ${dayKey()}`},15000);

</script>
</body>
</html>
