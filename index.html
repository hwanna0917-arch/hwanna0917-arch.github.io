<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extreme Demon Journey</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#171c26;--line:#28303d;--text:#f4f7fb;--muted:#8993a3;--accent:#55e6a5;--accent2:#67a8ff;--danger:#ff647c}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0%,#17242b 0,#090b10 35%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.container{max-width:1100px;margin:auto;padding:36px 20px 70px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
h1{font-size:34px;margin:0 0 7px;letter-spacing:-1px}.sub{color:var(--muted)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.15)} .primary{background:var(--accent);color:#06140e}
.hero{background:linear-gradient(135deg,#121c1d,#10151e);border:1px solid var(--line);border-radius:20px;padding:25px;margin-bottom:28px;box-shadow:0 15px 50px #0006}
.heroHead{display:flex;justify-content:space-between;gap:20px;align-items:center}.tag{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px}.hero h2{font-size:30px;margin:5px 0}.big{font-size:52px;font-weight:900}.bar{height:12px;background:#252c37;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#8cf7c5);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0d1118;border:1px solid var(--line);padding:15px;border-radius:13px}.stat b{font-size:21px;display:block;margin-top:5px}.label{font-size:12px;color:var(--muted)}
section{margin-top:28px} .sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px} h3{margin:0;font-size:20px}
.list{display:flex;flex-direction:column;gap:10px}.level{display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:15px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 16px}.num{color:var(--muted);font-weight:800}.level.active{border-color:#3dbf8a;box-shadow:0 0 25px #45e6a520}.name{font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pct{font-weight:900}.done{color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:table}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}tr:last-child td{border:0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(520px,100%);background:#121720;border:1px solid var(--line);border-radius:18px;padding:22px}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0a0e14;color:white;font-size:15px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.heroHead{align-items:flex-start}.big{font-size:40px}.level{grid-template-columns:35px 1fr auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div><div class="tag">GEOMETRY DASH • PERSONAL TRACKER</div><h1>Extreme Demon Journey</h1><div class="sub">내 익스트림 데몬 도전 기록</div></div>
    <button class="primary" onclick="openModal()">＋ 레벨 추가</button>
  </div>

  <div class="hero" id="hero"></div>

  <section>
    <div class="sectionHead"><h3>🎯 목표 순서</h3><button onclick="resetDemo()">데모 데이터 복구</button></div>
    <div class="list" id="levelList"></div>
  </section>

  <section>
    <div class="sectionHead"><h3>📈 최근 기록</h3></div>
    <table><thead><tr><th>레벨</th><th>날짜</th><th>세션 어템</th><th>베스트</th></tr></thead>
    <tbody id="sessions"></tbody></table>
  </section>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h2>레벨 추가</h2>
  <div class="grid">
   <div><label>레벨 이름</label><input id="name" placeholder="예: Sonic Wave"></div>
   <div><label>현재 Progress (%)</label><input id="progress" type="number" min="0" max="100" value="0"></div>
   <div><label>총 Attempts</label><input id="attempts" type="number" min="0" value="0"></div>
   <div><label>Best (%)</label><input id="best" type="number" min="0" max="100" value="0"></div>
  </div>
  <div class="actions"><button onclick="closeModal()">취소</button><button class="primary" onclick="addLevel()">추가</button></div>
 </div>
</div>

<script>
const DEMO=[
 {name:"Acu",progress:100,best:100,attempts:2341,done:true},
 {name:"Cataclysm",progress:100,best:100,attempts:4182,done:true},
 {name:"Bloodbath",progress:47,best:47,attempts:16842,done:false},
 {name:"Sakupen Hell",progress:0,best:0,attempts:0,done:false},
 {name:"Artificial Ascent",progress:0,best:0,attempts:0,done:false},
 {name:"Digital Descent",progress:0,best:0,attempts:0,done:false}
];
let levels=JSON.parse(localStorage.getItem("gdLevels")||"null")||DEMO;
let sessions=JSON.parse(localStorage.getItem("gdSessions")||"null")||[
 {name:"Bloodbath",date:"2026-09-12",attempts:883,best:47},
 {name:"Bloodbath",date:"2026-09-10",attempts:1160,best:46},
 {name:"Bloodbath",date:"2026-09-08",attempts:1184,best:43}
];
function save(){localStorage.setItem("gdLevels",JSON.stringify(levels));localStorage.setItem("gdSessions",JSON.stringify(sessions))}
function fmt(n){return Number(n||0).toLocaleString("ko-KR")}
function current(){return levels.find(x=>!x.done)||levels[levels.length-1]}
function render(){
 const c=current();
 document.getElementById("hero").innerHTML=`
  <div class="heroHead"><div><div class="tag">CURRENT CHALLENGE</div><h2>${c?.name||"없음"}</h2><div class="sub">다음 목표를 향해 진행 중</div></div><div class="big">${c?.progress||0}%</div></div>
  <div class="bar"><div class="fill" style="width:${c?.progress||0}%"></div></div>
  <div class="stats">
   <div class="stat"><span class="label">BEST</span><b>${c?.best||0}%</b></div>
   <div class="stat"><span class="label">TOTAL ATTEMPTS</span><b>${fmt(c?.attempts)}</b></div>
   <div class="stat"><span class="label">CLEARED</span><b>${levels.filter(x=>x.done).length}</b></div>
   <div class="stat"><span class="label">REMAINING</span><b>${levels.filter(x=>!x.done).length}</b></div>
  </div>`;
 document.getElementById("levelList").innerHTML=levels.map((x,i)=>`
  <div class="level ${x===c?'active':''}">
   <div class="num">${String(i+1).padStart(2,"0")}</div>
   <div><div class="name">${x.done?'✓ ':''}${x.name}</div><div class="meta">${x.done?'클리어 • '+fmt(x.attempts)+' attempts':'Best '+x.best+'% • '+fmt(x.attempts)+' attempts'}</div></div>
   <div class="pct ${x.done?'done':''}">${x.progress}%</div>
  </div>`).join("");
 document.getElementById("sessions").innerHTML=sessions.map(s=>`<tr><td>${s.name}</td><td>${s.date}</td><td>${fmt(s.attempts)}</td><td>${s.best}%</td></tr>`).join("");
}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function addLevel(){
 const name=document.getElementById("name").value.trim(); if(!name)return alert("레벨 이름을 입력해줘.");
 levels.push({name,progress:+document.getElementById("progress").value||0,best:+document.getElementById("best").value||0,attempts:+document.getElementById("attempts").value||0,done:+document.getElementById("progress").value>=100});
 save();render();closeModal();["name","progress","attempts","best"].forEach(id=>document.getElementById(id).value=id==="progress"||id==="attempts"||id==="best"?"0":"");
}
function resetDemo(){if(confirm("현재 기록을 데모 데이터로 되돌릴까?")){levels=JSON.parse(JSON.stringify(DEMO));save();render()}}
render();
</script>
</body>
</html>
